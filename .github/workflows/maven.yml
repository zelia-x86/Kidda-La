name: Java CI with Maven

on:
  workflow_dispatch:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: KIDDA_LA
          MYSQL_USER: user1
          MYSQL_PASSWORD: pass1
        ports:
          - 65534:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Wait for MySQL
      run: |
        for i in {1..30}; do
          if mysqladmin ping -h 127.0.0.1 -P 65534 \
            -uuser1 -ppass1 --silent; then
            echo "MySQL is ready!"
            exit 0
          fi
          sleep 2
        done

        echo "MySQL failed to start"
        docker ps -a
        exit 1

    - name: Bootstrap database
      run: |
        mysql -h 127.0.0.1 -P 65534 \
          -u user1 -ppass1 KIDDA_LA < docs/sql/2_テーブル定義.sql
        mysql -h 127.0.0.1 -P 65534 \
          -u user1 -ppass1 KIDDA_LA < docs/sql/3_データ.sql

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        path: target/KiddaLa.war

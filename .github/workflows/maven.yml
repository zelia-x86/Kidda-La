name: Java CI with Maven

on:
  workflow_dispatch:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master", "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Install MySQL
      run: |
        sudo apt-get update
        sudo apt-get install -y mysql-server mysql-client

    - name: Start MySQL
      run: |
        sudo sed -i 's/^port\s*=.*/port = 65534/' /etc/mysql/mysql.conf.d/mysqld.cnf
        sudo sed -i 's/^bind-address.*/bind-address = 127.0.0.1/' /etc/mysql/mysql.conf.d/mysqld.cnf

        sudo systemctl enable mysql
        sudo systemctl restart mysql

        for i in {1..30}; do
          if sudo mysqladmin --protocol=TCP -h 127.0.0.1 -P 65534 ping --silent; then
            echo "MySQL is ready!"
            exit 0
          fi
          sleep 2
        done

        echo "MySQL failed to start"
        sudo journalctl -u mysql --no-pager -n 100
        exit 1


    - name: Bootstrap database
      run: |
        sudo mysql -h 127.0.0.1 -P 65534 \
          -u user1 -ppass1 KIDDA_LA < docs/sql/1_データベース定義.sql
        mysql -h 127.0.0.1 -P 65534 \
          -u user1 -ppass1 KIDDA_LA < docs/sql/2_テーブル定義.sql
        mysql -h 127.0.0.1 -P 65534 \
          -u user1 -ppass1 KIDDA_LA < docs/sql/3_データ.sql

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Update dependency graph
      uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7.0.2
      with:
        path: target/KiddaLa.war